<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Opera Records - Catálogo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <header>
        <h1>Opera Records</h1>
        <nav>
            <span style="color: var(--vinho-escuro); font-weight: bold;">Olá, {{ nome }}</span>
            <a href="{{ url_for('catalogo') }}">Catálogo</a>
            <a href="{{ url_for('ver_carrinho') }}">Carrinho</a>
            <a href="{{ url_for('artistas') }}">Artistas</a>
            <a href="{{ url_for('generos') }}">Gêneros</a>
            <a href="{{ url_for('pedidos') }}">Meus Pedidos</a>
            <a href="{{ url_for('logout') }}" style="color: #8b0000;">Sair</a>
        </nav>
    </header>

    <div class="container">
        <div style="display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 2px; color: #4a284e; margin-bottom: 10px; font-weight: bold;">
            <span>CAMILA E EMANUELLE</span>
            <span>LOJA DE DISCOS DE VINIL</span>
        </div>
        <h2>Catálogo de Discos</h2>

        <!-- Barra de Pesquisa Estilizada -->
        <div style="margin-bottom: 25px;">
            <input type="text" id="filtroBusca" placeholder="🔍 Pesquisar por música, artista, gênero ou ano..." style="width: 100%; padding: 12px; font-size: 14px; border-radius: 8px; border: 1px solid #ddd; outline: none; background-color: #fff;">
        </div>

        <div class="catalogo-grid" id="gridCatalogo">
            {% for d in discos %}
            <div class="disco-card">
                <div>
                    <!-- Vitrine com Capa do Álbum e Vinil saindo para fora -->
                    <div class="produto-vitrine">
                        <div class="capa-album">
                            <img src="{{ d.imagem }}" alt="{{ d.musica }}" onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/b/b6/12in-Vinyl-LP-Record-Angle.jpg';">
                        </div>
                        <div class="disco-vinil"></div>
                    </div>

                    <div class="disco-info">
                        <h3>{{ d.musica }}</h3>
                        <p>{{ d.artista }} · {{ d.genero }} · {{ d.ano }}</p>
                    </div>
                </div>

                <div>
                    <div class="disco-preco">R$ {{ "%.2f"|format(d.preco) }}</div>
                    <form action="{{ url_for('adicionar_carrinho', id_disco=d.id) }}" method="POST">
                        <button type="submit" class="btn" style="width: 100%;">Comprar</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Script JavaScript para filtrar os cards em tempo real -->
    <script>
        document.getElementById('filtroBusca').addEventListener('keyup', function() {
            let termo = this.value.toLowerCase();
            let cards = document.querySelectorAll('.disco-card');

            cards.forEach(function(card) {
                let textoCard = card.innerText.toLowerCase();
                if (textoCard.includes(termo)) {
                    card.style.display = ""; // Mostra o card se encontrar
                } else {
                    card.style.display = "none"; // Esconde se não encontrar
                }
            });
        });
    </script>
</body>
</html>
