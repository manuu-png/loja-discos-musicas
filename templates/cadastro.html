<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Opera Records - Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <h1>Opera Records</h1>
        <p style="margin-bottom: 20px; color: #a8a8b3;">Crie sua conta</p>

        <form method="POST">
            <label>Nome:</label>
            <input type="text" name="nome" required>

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit">Cadastrar e Entrar</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">Já tem uma conta? <a href="{{ url_for('login') }}">Fazer login</a></p>
    </div>
</body>
</html>
