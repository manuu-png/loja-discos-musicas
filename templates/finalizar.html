<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Opera Records - Finalizar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Opera Records</h1>
        <h2>Finalizar Compra</h2>
        <p><strong>Disco:</strong> {{ disco[4] }} — <strong>Artista:</strong> {{ disco[2] }}</p>
        <p><strong>Preço Unitário:</strong> R$ {{ "%.2f"|format(preco) }}</p>
        <p style="color: #00b37e; margin-top: 10px;">📦 Taxa do entregador: R$ 5,00. Vai chegar no máximo em **48 horas**.</p>

        <form method="POST" style="margin-top: 20px;">
            <label>Quantidade:</label>
            <input type="number" name="quantidade" value="1" min="1" required>

            <label>Endereço de Entrega:</label>
            <input type="text" name="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" required>

            <label>Forma de Pagamento:</label>
            <select name="pagamento" required>
                <option value="Pix">Pix</option>
                <option value="Cartão">Cartão</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>

            <button type="submit">Confirmar Pedido</button>
        </form>
    </div>
</body>
</html>
