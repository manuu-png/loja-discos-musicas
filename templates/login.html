<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Opera Records - Login</title>
    <!-- Link dos ícones do Materialize (obrigatório para o disco aparecer) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Seu CSS original -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <style>
        @keyframes girarDisco {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .disco-animado {
            font-size: 38px;
            color: var(--vinho-escuro);
            animation: girarDisco 6s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">

        <!-- Título com o disco girando de enfeite -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px;">
            <i class="material-icons disco-animado">album</i>
            <h1 style="margin: 0; font-size: 28px; color: var(--vinho-escuro);">Opera Records</h1>
        </div>

        <p style="margin-bottom: 20px; color: #666; text-align: center;">Entre na sua conta</p>

        {% if erro %}
        <p style="color: #f75a68; margin-bottom: 15px; text-align: center; font-weight: bold;">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Senha:</label>
            <input type="password" name="senha" required>

            <button type="submit" style="width: 100%;">Entrar</button>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            Não tem uma conta? <a href="{{ url_for('cadastro') }}" style="color: var(--vinho-escuro); font-weight: bold;">Cadastre-se</a>
        </p>
    </div>
</body>
</html>
